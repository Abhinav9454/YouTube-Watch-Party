services:
  # Backend Web Service (Spring Boot 3 + Java 21 LTS + WebSockets + MongoDB Atlas)
  - type: web
    name: watchparty-backend
    env: docker
    dockerContext: ./YouTube_Watch_Party/backend
    dockerfilePath: ./YouTube_Watch_Party/backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_CLUSTER
        sync: false
      - key: MONGODB_DATABASE
        value: watchparty

  # Frontend Web Service (React 19 + TypeScript + Vite + Nginx Reverse Proxy)
  - type: web
    name: watchparty-frontend
    env: docker
    dockerContext: ./YouTube_Watch_Party/frontend
    dockerfilePath: ./YouTube_Watch_Party/frontend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 80
