# Server Configuration
server.port=8080

# Application Details
spring.application.name=youtube-watch-party-backend

# Support importing local .env file (safely ignored by Git)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Exclude unnecessary default Mongo auto-configurations to avoid localhost:27017 socket attempts
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# =========================================================================
# Database Configuration: MongoDB Extension for Hibernate ORM
# =========================================================================
# Official MongoDB Extension Dialect & Connection Provider
spring.jpa.properties.hibernate.dialect=MongoDB
spring.jpa.properties.hibernate.connection.provider_class=com.mongodb.hibernate.internal.jdbc.MongoConnectionProvider
spring.jpa.properties.com.mongodb.hibernate.semantics.nulls=MQL

# Direct Hibernate properties
hibernate.dialect=MongoDB
hibernate.connection.provider_class=com.mongodb.hibernate.internal.jdbc.MongoConnectionProvider
com.mongodb.hibernate.semantics.nulls=MQL

# MongoDB Atlas Secure Connection URL (database: watchparty)
# Injected dynamically from MONGODB_URI or (.env / environment variables).
# USERNAME, PASSWORDS AND CLUSTERS ARE NEVER HARDCODED OR COMMITTED TO GIT.
spring.jpa.properties.jakarta.persistence.jdbc.url=${MONGODB_URI:mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_CLUSTER}/${MONGODB_DATABASE:watchparty}?appName=AbhinavNagvanshi&retryWrites=true&w=majority}
jakarta.persistence.jdbc.url=${MONGODB_URI:mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_CLUSTER}/${MONGODB_DATABASE:watchparty}?appName=AbhinavNagvanshi&retryWrites=true&w=majority}

# JPA / Hibernate Settings (DDL schema export disabled for MongoDB NoSQL documents)
spring.jpa.hibernate.ddl-auto=none
hibernate.hbm2ddl.auto=none
jakarta.persistence.schema-generation.database.action=none
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
