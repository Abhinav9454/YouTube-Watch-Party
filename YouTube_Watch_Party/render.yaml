services:
  # Backend Web Service (Spring Boot 3 + Java 21 LTS + WebSockets + H2 SQL)
  - type: web
    name: syncwave-watchparty-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_USERNAME
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_CLUSTER
        sync: false
      - key: MONGODB_DATABASE
        value: watchparty

  # Frontend Web Service (React 19 + TypeScript + Vite + Nginx Reverse Proxy)
  - type: web
    name: syncwave-watchparty-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 80
